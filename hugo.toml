baseURL = "https://www.sudlice.org/"   # the Pages workflow overrides this with the real site URL
defaultContentLanguage = "en"
timeZone = "Europe/Prague"
enableRobotsTXT = true

# Shared facts only. Words visitors read live in content/*.md (EN) and content/*.cs.md (CZ).
# The few fixed interface labels live in i18n/en.toml and i18n/cs.toml.
[params]
  brand = "Studio M"
  address = "Vodickova 415/2, 110 00 Praha 1"
  phone = "+420 601 123 456"
  phoneHref = "tel:+420601123456"
  email = "info@studiom.example"
  mapsUrl = "https://www.mapy.com/turisticka?q=Prague"
  # Map embed URL of the salon (Mapy.com or Google Maps, Share -> Embed a map -> src value). Empty = no map.
  mapEmbed = ""
  facebook = "https://www.facebook.com/"
  instagram = "https://www.instagram.com/"

[languages]
  [languages.en]
    locale = "en"
    label = "EN"
    title = "Studio M - Massage Salon"
    weight = 1

    [languages.en.params]
      description = "Massage salon in Prague. Swedish, deep tissue, lymphatic drainage and hot stone massage. Call or write to set a time."

    [[languages.en.menu.main]]
      name = "Services"
      url = "#services"
      weight = 1
    [[languages.en.menu.main]]
      name = "About"
      url = "#about"
      weight = 2
    [[languages.en.menu.main]]
      name = "Contact"
      url = "#contact"
      weight = 4

  [languages.cs]
    locale = "cs"
    label = "CS"
    title = "Studio M - Masážní studio"
    weight = 2

    [languages.cs.params]
      description = "Masážní studio v Praze. Švédská masáž, hluboká tkáňová masáž, lymphodrenáž a masáž horkými kameny. Zavolejte nebo napište a domluvíme termín."

    [[languages.cs.menu.main]]
      name = "Služby"
      url = "#services"
      weight = 1
    [[languages.cs.menu.main]]
      name = "O studiu"
      url = "#about"
      weight = 2
    [[languages.cs.menu.main]]
      name = "Kontakt"
      url = "#contact"
      weight = 4

[taxonomies]

[minify]
  disableXML = true
