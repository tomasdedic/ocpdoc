<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    {{ range .Translations }}<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">
    {{ end }}<link rel="alternate" hreflang="x-default" href="{{ site.Home.Permalink }}">
    <link rel="icon" type="image/svg+xml" href="{{ "img/favicon.svg" | relURL }}">
    <link rel="stylesheet" href="{{ "css/bootstrap.min.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/brand.css" | relURL }}">
  </head>
  <body>
    <a class="visually-hidden-focusable" href="#main">Skip to content</a>
    {{ partial "nav.html" . }}
    <main id="main">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
    <script src="{{ "js/bootstrap.bundle.min.js" | relURL }}"></script>
  </body>
</html>
