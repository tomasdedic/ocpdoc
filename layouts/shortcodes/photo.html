{{ $src := .Get "src" }}
{{ with $.Page.Resources.GetMatch $src }}
  {{ $img := .Fill "1200x800 WebP q80 Center" }}
  <figure class="my-4">
    <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}"
         alt="{{ $.Get "alt" | default "" }}" class="img-fluid rounded-4" loading="lazy" decoding="async">
    {{ with $.Get "caption" }}<figcaption class="small text-secondary mt-2">{{ . }}</figcaption>{{ end }}
  </figure>
{{ else }}
  {{ warnf "photo shortcode: %q is not a file in %s" $src $.Page.File.Path }}
{{ end }}
