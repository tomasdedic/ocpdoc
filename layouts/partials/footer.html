{{ if or site.Params.facebook site.Params.instagram }}
<footer class="border-top py-4">
  <div class="container">
    <ul class="list-unstyled d-flex flex-wrap gap-4 mb-0">
      {{ with site.Params.facebook }}<li><a href="{{ . }}">Facebook</a></li>{{ end }}
      {{ with site.Params.instagram }}<li><a href="{{ . }}">Instagram</a></li>{{ end }}
    </ul>
  </div>
</footer>
{{ end }}
