<nav class="navbar navbar-expand-lg sticky-top bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ "/" | relURL }}">{{ site.Params.brand | default site.Title }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainnav"
            aria-controls="mainnav" aria-expanded="false" aria-label="Menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainnav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        {{ range site.Menus.main }}
          <li class="nav-item"><a class="nav-link" href="{{ .URL | relURL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
      {{ with site.Params.phoneHref }}
        <a class="btn btn-brand btn-sm" href="{{ . | safeURL }}">{{ site.Params.phone }}</a>
      {{ end }}
    </div>
  </div>
</nav>
<script>
  // One page site on a phone: closing the menu makes the page shorter, so the
  // browser's own anchor jump lands above the section. Close first, then scroll.
  document.querySelectorAll('#mainnav a').forEach(function (link) {
    link.addEventListener('click', function (event) {
      var menu = document.getElementById('mainnav');
      var hash = link.getAttribute('href');
      if (!menu.classList.contains('show') || !hash || hash.charAt(0) !== '#') { return; }
      var target = document.querySelector(hash);
      if (!target) { return; }
      event.preventDefault();
      menu.addEventListener('hidden.bs.collapse', function () {
        history.replaceState(null, '', hash);
        target.scrollIntoView();
      }, { once: true });
      bootstrap.Collapse.getOrCreateInstance(menu).hide();
    });
  });
</script>
