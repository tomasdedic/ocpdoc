# Short reasons, shown under the hero as a row. Any number works: the columns
# split the row evenly from 992px up.
- title: Private room
  text: One client at a time. No talking through a curtain, no waiting for the next bed to be free.
- title: Fixed 10 minute gap
  text: Every booking has room to get dressed slowly and drink some water before the next visit.
- title: No products pushed on you
  text: Oil only. If you want to buy anything, you will have to ask.
