# One entry per treatment. Prices are plain text, so the owner can write
# "180 zl" or "from 180 zl" without breaking anything.
- name: Back, neck and shoulders
  duration: 30 min
  price: 140 zl
  short: Fast relief for desk work tension.
  description: Focused work on the most loaded part of the body. Good first visit if you are unsure what to choose.

- name: Whole body massage
  duration: 60 min
  price: 220 zl
  short: Classic Swedish massage, head to feet.
  description: Full body with medium pressure. Arms, legs, back, shoulders, neck and décolleté. The most booked treatment.

- name: Deep tissue
  duration: 60 min
  price: 250 zl
  short: Strong pressure for chronic tension.
  description: Slow, firm work on deep muscle layers and fascia. Expect some soreness the next day, then a lot of relief.

- name: Hot stone
  duration: 75 min
  price: 280 zl
  short: Warm basalt stones plus manual work.
  description: Heated stones are placed on the back and used to massage the muscles. Deep warmth, very calm session.

- name: Lymphatic drainage
  duration: 60 min
  price: 240 zl
  short: Manual drainage for swelling and heavy legs.
  description: Light rhythmic strokes that move lymph. Often chosen after long travel, in summer, or during reduction diets.

- name: Sport massage
  duration: 60 min
  price: 260 zl
  short: Preparation and recovery for training.
  description: Brisk work before effort, loosening work after. Helps with muscle tightness and range of motion.
