# Rendered as a Bootstrap accordion.
- q: How long before should I book?
  a: Two to four days in the week, one to two weeks for Friday evening and Saturday. Urgent pain? Call instead of writing, cancellations happen every day.
- q: What should I bring?
  a: Nothing but yourself. Sheets, towels, oil and disposable underwear are provided. Leave jewellery at home.
- q: Can I come while pregnant?
  a: After the first trimester, yes, from week 14, side lying position, no deep tissue and no abdomen work. Say how far along you are when you book.
- q: When should I not come?
  a: Fever, infection, fresh injury or wound, skin disease in the treated area, untreated blood clot, right after surgery, or chemo. If in doubt, ask your doctor first and tell me about it.
- q: How do I pay?
  a: Card or cash at the studio. Series and vouchers are paid in advance by transfer.
- q: Can I cancel?
  a: Free of charge up to 12 hours before. Later than that the visit counts as used, because the slot cannot be given to anybody else.
